<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Read-only browser smoke test</title>
  <script src="../../assessment-parser.js"></script>
  <script src="../../monaco-bridge.js"></script>
</head>
<body data-smoke-status="pending" data-dom-unchanged="pending">
  <h1>Read-only browser smoke test</h1>
  <iframe id="fixture-basic" src="../fixtures/assessment-basic.html" title="Basic assessment fixture"></iframe>
  <iframe id="fixture-legacy" src="../fixtures/assessment-legacy.html" title="Legacy assessment fixture"></iframe>
  <iframe id="fixture-mixed" src="../fixtures/assessment-mixed.html" title="Mixed assessment fixture"></iframe>
  <iframe id="fixture-malformed" src="../fixtures/assessment-malformed.html" title="Malformed assessment fixture"></iframe>
  <pre id="smoke-output">pending</pre>

  <script>
    (function () {
      "use strict";

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function snapshotDocument(doc) {
        return JSON.stringify({
          html: doc.body.innerHTML,
          controls: Array.from(doc.querySelectorAll("input, textarea, [contenteditable]"))
            .map((node) => ({
              tagName: node.tagName,
              type: node.getAttribute("type") || "",
              checked: Boolean(node.checked),
              value: typeof node.value === "string" ? node.value : "",
              textContent: node.textContent || "",
              disabled: Boolean(node.disabled)
            }))
        });
      }

      function inspectFixture(frameId, expectations) {
        const fixtureFrame = document.getElementById(frameId);
        assert(fixtureFrame && fixtureFrame.contentDocument, `${frameId} did not load.`);

        const fixtureDocument = fixtureFrame.contentDocument;
        const before = snapshotDocument(fixtureDocument);
        const blocks = AssessmentParserKit.assessmentQuestionBlocks(fixtureDocument);
        const extracted = blocks.map((block, index) => (
          AssessmentParserKit.extractQuestionShell(block, index + 1)
        ));
        const types = extracted.map((entry) => entry?.question?.type || "missing");
        const diagnostics = AssessmentParserKit.selectorDiagnostics(fixtureDocument);
        const after = snapshotDocument(fixtureDocument);

        assert(blocks.length === expectations.totalQuestions,
          `${frameId}: expected ${expectations.totalQuestions} question blocks, found ${blocks.length}.`);
        assert(JSON.stringify(types) === JSON.stringify(expectations.types),
          `${frameId}: unexpected question types ${JSON.stringify(types)}.`);
        assert(diagnostics.strategy === expectations.strategy,
          `${frameId}: expected ${expectations.strategy} strategy, found ${diagnostics.strategy}.`);
        assert(diagnostics.semanticCandidates === expectations.semanticCandidates,
          `${frameId}: unexpected semantic candidate count.`);
        assert(diagnostics.semanticPrompts === expectations.semanticPrompts,
          `${frameId}: unexpected semantic prompt count.`);
        assert(diagnostics.legacyCandidates === expectations.legacyCandidates,
          `${frameId}: unexpected legacy candidate count.`);
        assert(diagnostics.legacyPrompts === expectations.legacyPrompts,
          `${frameId}: unexpected legacy prompt count.`);
        assert(diagnostics.invalidCandidates === expectations.invalidCandidates,
          `${frameId}: unexpected invalid candidate count.`);
        assert(diagnostics.selectedBlocks === expectations.totalQuestions,
          `${frameId}: selected block count did not match extracted block count.`);
        assert(before === after, `${frameId}: read-only parsing changed DOM or control state.`);

        return {
          totalQuestions: blocks.length,
          types,
          selectorStrategy: diagnostics.strategy,
          invalidCandidates: diagnostics.invalidCandidates,
          domUnchanged: true,
          blocks
        };
      }

      window.addEventListener("load", function () {
        const output = document.getElementById("smoke-output");

        try {
          assert(globalThis.AssessmentParserKit, "AssessmentParserKit was not loaded.");
          assert(globalThis.MonacoBridgeKit, "MonacoBridgeKit was not loaded.");

          const basic = inspectFixture("fixture-basic", {
            totalQuestions: 4,
            types: ["single_answer", "multiple_answer", "text_input", "code_expression"],
            strategy: "semantic",
            semanticCandidates: 4,
            semanticPrompts: 4,
            legacyCandidates: 0,
            legacyPrompts: 0,
            invalidCandidates: 0
          });
          const codeDescriptor = MonacoBridgeKit.describeCodeEditor(basic.blocks[3]);
          assert(codeDescriptor.modelUri === "inmemory://model/example", "Unexpected Monaco model URI.");
          assert(codeDescriptor.language === "javascript", "Unexpected Monaco language.");

          const legacy = inspectFixture("fixture-legacy", {
            totalQuestions: 2,
            types: ["single_answer", "text_input"],
            strategy: "legacy",
            semanticCandidates: 0,
            semanticPrompts: 0,
            legacyCandidates: 2,
            legacyPrompts: 2,
            invalidCandidates: 0
          });

          const mixed = inspectFixture("fixture-mixed", {
            totalQuestions: 2,
            types: ["single_answer", "text_input"],
            strategy: "mixed",
            semanticCandidates: 1,
            semanticPrompts: 1,
            legacyCandidates: 2,
            legacyPrompts: 2,
            invalidCandidates: 0
          });

          const malformed = inspectFixture("fixture-malformed", {
            totalQuestions: 1,
            types: ["text_input"],
            strategy: "semantic",
            semanticCandidates: 2,
            semanticPrompts: 1,
            legacyCandidates: 1,
            legacyPrompts: 0,
            invalidCandidates: 2
          });

          document.body.dataset.smokeStatus = "pass";
          document.body.dataset.domUnchanged = "true";
          output.textContent = JSON.stringify({
            status: "pass",
            fixtures: {
              basic: { ...basic, blocks: undefined },
              legacy: { ...legacy, blocks: undefined },
              mixed: { ...mixed, blocks: undefined },
              malformed: { ...malformed, blocks: undefined }
            },
            monaco: {
              modelUri: codeDescriptor.modelUri,
              language: codeDescriptor.language
            },
            domUnchanged: true
          });
        } catch (error) {
          document.body.dataset.smokeStatus = "fail";
          document.body.dataset.domUnchanged = "false";
          output.textContent = JSON.stringify({
            status: "fail",
            message: error?.message || String(error)
          });
        }
      });
    })();
  </script>
</body>
</html>
